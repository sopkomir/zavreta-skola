# V produkcii (na Verceli) sa prihlasuje cez GitHub OAuth (viď /api/auth a /api/callback).
# Lokálne, keď beží "npx decap-server", sa automaticky prepne na jednoduchý
# režim bez prihlásenia vďaka nastaveniu local_backend nižšie.
backend:
  name: github
  repo: sopkomir/zavreta-skola
  branch: main
  base_url: https://zavreta-skola.vercel.app
  auth_endpoint: api/auth

local_backend: true

media_folder: "public/uploaded-images"
public_folder: "/uploaded-images"

collections:
  - name: "settings"
    label: "Nastavenia webu"
    files:
      - name: "seo"
        label: "SEO a zdieľanie na sociálnych sieťach"
        file: "src/data/site-settings.json"
        fields:
          - { label: "Názov webu", name: "siteTitle", widget: "string" }
          - label: "Predvolený SEO popis"
            name: "defaultDescription"
            widget: "text"
            hint: "Použije sa všade tam, kde konkrétny námet/článok nemá vlastný SEO popis."
          - label: "Predvolený náhľadový obrázok (pre zdieľanie)"
            name: "defaultOgImage"
            widget: "image"
            hint: "Zobrazí sa pri zdieľaní domovskej stránky a kdekoľvek, kde nie je vlastný obrázok."

  - name: "namety"
    label: "Námety"
    label_singular: "Námet"
    folder: "src/content/namety"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    summary: "{{title}} — {{categories}}"
    sortable_fields: ["title", "pubDate", "author"]
    fields:
      - { label: "Názov", name: "title", widget: "string" }
      - { label: "Dátum", name: "pubDate", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Autor", name: "author", widget: "string" }
      - label: "Kategórie"
        name: "categories"
        widget: "list"
        hint: "Presné názvy nájdete v src/data/categories.json (napr. \"Matematika - 1. stupeň\")"
      - label: "Typy"
        name: "types"
        widget: "list"
        hint: "Napr. HRA, AUDIO/VIDEO, APPKA, WEBKA, CVIKA, NÁVOD, PRINT"
      - label: "Hlavný obrázok"
        name: "image"
        widget: "image"
        required: false
        hint: "Nahrajte súbor, alebo môžete priamo vložiť/prilepiť URL adresu existujúceho obrázka."
      - label: "Fotogaléria (voliteľné)"
        name: "gallery"
        widget: "list"
        field: { label: "Obrázok", name: "image", widget: "image" }
        required: false
        hint: "Ľubovoľný počet ďalších fotiek k tomuto námetu."
      - { label: "YouTube ID", name: "youtubeId", widget: "string", required: false, hint: "Len samotné ID z odkazu (11 znakov), nie celá URL" }
      - { label: "Wordwall embed URL", name: "wordwallEmbed", widget: "string", required: false }
      - label: "Iný vložený obsah (embed kód)"
        name: "embedHtml"
        widget: "text"
        required: false
        hint: "Sem vložte CELÝ <iframe>... kód, ktorý dostanete napr. z Facebooku, Instagramu, Genially, H5P a podobne. Zobrazí sa presne tak, ako je vložený."
      - label: "SEO popis (voliteľné)"
        name: "metaDescription"
        widget: "text"
        required: false
        hint: "Krátky popis (ideálne do 155 znakov) pre Google a náhľad pri zdieľaní na Facebooku/WhatsAppe. Ak necháte prázdne, vygeneruje sa automaticky zo začiatku textu."
      - { label: "Text", name: "body", widget: "markdown" }

  - name: "clanky"
    label: "Články"
    label_singular: "Článok"
    folder: "src/content/clanky"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"
    sortable_fields: ["title", "pubDate", "author"]
    fields:
      - { label: "Názov", name: "title", widget: "string" }
      - { label: "Dátum", name: "pubDate", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Autor", name: "author", widget: "string" }
      - { label: "Rubrika", name: "rubrika", widget: "list" }
      - label: "Hlavný obrázok"
        name: "image"
        widget: "image"
        required: false
        hint: "Nahrajte súbor, alebo môžete priamo vložiť/prilepiť URL adresu existujúceho obrázka."
      - label: "Fotogaléria (voliteľné)"
        name: "gallery"
        widget: "list"
        field: { label: "Obrázok", name: "image", widget: "image" }
        required: false
      - { label: "YouTube ID", name: "youtubeId", widget: "string", required: false }
      - label: "Iný vložený obsah (embed kód)"
        name: "embedHtml"
        widget: "text"
        required: false
        hint: "Sem vložte CELÝ <iframe>... kód (Facebook, Instagram, Genially, H5P a pod.)."
      - label: "SEO popis (voliteľné)"
        name: "metaDescription"
        widget: "text"
        required: false
        hint: "Krátky popis (ideálne do 155 znakov) pre Google a náhľad pri zdieľaní. Ak necháte prázdne, vygeneruje sa automaticky."
      - { label: "Text", name: "body", widget: "markdown" }
